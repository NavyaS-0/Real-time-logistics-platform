spring.application.name=tracking-service

server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/logistics?options=-c%20TimeZone%3DUTC
spring.datasource.username=logistics_user
spring.datasource.password=${DB_PASSWORD:logistics_pass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=tracking-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.jackson.time-zone=UTC